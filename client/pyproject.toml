[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "act-work-client"
version = "1.0.0"
description = "DUT work client for the ACT work server"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
act-work-client = "actwork.__main__:main"

[tool.setuptools]
packages = ["actwork"]
